services:
  evaluator-worker:
    build:
      context: ..
      dockerfile: evaluator/Dockerfile
    container_name: algo-evaluator-worker
    restart: unless-stopped
    volumes:
      # Mount host Docker socket so the worker orchestrates isolated sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - HEALTH_PORT=${HEALTH_PORT:-8080}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-25}
      - SANDBOX_MEMORY_LIMIT_MB=${SANDBOX_MEMORY_LIMIT_MB:-256}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-1.0}
      - CALIBRATED_BASELINE_OPS_SEC=${CALIBRATED_BASELINE_OPS_SEC:-72296}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
